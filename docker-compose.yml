version: "3.8"

services:
  api:
    build: .
    ports:
      - "8011:8011"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - SEARXNG_BASE_URL=http://searxng:8080
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - rag_data:/app/data
    depends_on:
      - ollama
      - searxng
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # After starting, pull the model:
    # docker exec -it rag-ollama-1 ollama pull llama3.1:8b

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped

  # streamlit:
  #   build: .
  #   command: streamlit run app/ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
  #   ports:
  #     - "8501:8501"
  #   environment:
  #     - API_URL=http://api:8011
  #   depends_on:
  #     - api
  #   restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  rag_data:
  ollama_data:
